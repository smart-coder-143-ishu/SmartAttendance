name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # सीधे आपके फोल्डर के अंदर काम करने के लिए:
    defaults:
      run:
        working-directory: SmartAttendance-Android-Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Missing Resources & Gradle Setup
        run: |
          # अगर गलती से 'scr' फोल्डर है तो उसे 'src' में बदलें
          if [ -d "app/scr" ]; then
            mv app/scr app/src
          fi

          # Top-level build.gradle.kts को सही करें
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
          }
          EOF

          # अगर strings.xml या themes.xml नहीं हैं तो उन्हें बनाएं
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Smart Attendance</string>
          </resources>
          EOF
          fi

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SmartAttendance" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          fi

          # AndroidManifest.xml में डिफ़ॉल्ट आइकन सेट करें ताकि aapt2 एरर न आए
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
            sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-APK
          path: SmartAttendance-Android-Project/app/build/outputs/apk/debug/app-debug.apk
