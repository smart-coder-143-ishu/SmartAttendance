name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartAttendance-Android-Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Missing App Files & Fix Config
        run: |
          if [ -d "app/scr" ]; then
            mv app/scr app/src
          fi

          # 1. gradle.properties banayein
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 2. Top-level build.gradle.kts fix
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
          }
          EOF

          # 3. minSdk ko 26 karein taaki java.time.LocalDate bina crash ke chale
          sed -i 's/minSdk = 24/minSdk = 26/g' app/build.gradle.kts

          # 4. Missing strings.xml aur themes.xml banayein
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Smart Attendance</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SmartAttendance" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # 5. AndroidManifest.xml icon fix
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
            sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
          fi

          # 6. Theme.kt fix
          mkdir -p app/src/main/java/com/smartattendance/app/ui/theme
          cat << 'EOF' > app/src/main/java/com/smartattendance/app/ui/theme/Theme.kt
          package com.smartattendance.app.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFFD0BCFF),
              secondary = Color(0xFFCCC2DC),
              tertiary = Color(0xFFEFB8C8)
          )

          private val LightColorScheme = lightColorScheme(
              primary = Color(0xFF6650a4),
              secondary = Color(0xFF625b71),
              tertiary = Color(0xFF7D5260)
          )

          @Composable
          fun SmartAttendanceTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = true,
              content: @Composable () -> Unit
          ) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> {
                      val context = LocalContext.current
                      if (darkTheme) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
                  }
                  darkTheme -> DarkColorScheme
                  else -> LightColorScheme
              }
              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = Typography(),
                  content = content
              )
          }
          EOF

          # 7. DashboardViewModel.kt launch import fix
          for ktfile in $(find app/src -name "*ViewModel.kt"); do
            if ! grep -q "import kotlinx.coroutines.launch" "$ktfile"; then
              sed -i '/^package /a import kotlinx.coroutines.launch' "$ktfile"
            fi
          done

          # 8. MISSING SmartAttendanceApp.kt banayein
          cat << 'EOF' > app/src/main/java/com/smartattendance/app/SmartAttendanceApp.kt
          package com.smartattendance.app

          import android.app.Application
          import com.smartattendance.app.data.local.AppDatabase
          import com.smartattendance.app.data.repository.AttendanceRepository

          class SmartAttendanceApp : Application() {
              val database: AppDatabase by lazy { AppDatabase.getDatabase(this) }
              val repository: AttendanceRepository by lazy {
                  AttendanceRepository(database.studentDao(), database.attendanceDao())
              }
          }
          EOF

          # 9. MISSING MainActivity.kt banayein (Attendance, Students aur Dashboard ke sath)
          cat << 'EOF' > app/src/main/java/com/smartattendance/app/MainActivity.kt
          package com.smartattendance.app

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.smartattendance.app.data.model.AttendanceRecord
          import com.smartattendance.app.data.model.Student
          import com.smartattendance.app.data.repository.AttendanceRepository
          import com.smartattendance.app.ui.screens.DailyAttendanceScreen
          import com.smartattendance.app.ui.theme.SmartAttendanceTheme
          import com.smartattendance.app.ui.viewmodel.DashboardViewModel
          import kotlinx.coroutines.launch
          import java.time.LocalDate

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val app = application as SmartAttendanceApp
                  val repository = app.repository
                  val dashboardViewModel = DashboardViewModel(repository)

                  setContent {
                      SmartAttendanceTheme {
                          MainAppScreen(repository = repository, dashboardViewModel = dashboardViewModel)
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainAppScreen(
              repository: AttendanceRepository,
              dashboardViewModel: DashboardViewModel
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var currentTab by remember { mutableStateOf(0) }
              var selectedDate by remember { mutableStateOf(LocalDate.now().toString()) }

              val students by repository.allStudents.collectAsState(initial = emptyList())
              val dateRecords by remember(selectedDate) {
                  repository.getRecordsForDate(selectedDate)
              }.collectAsState(initial = emptyList())
              val dashState by dashboardViewModel.uiState.collectAsState()

              var showAddStudentDialog by remember { mutableStateOf(false) }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          NavigationBarItem(
                              selected = currentTab == 0,
                              onClick = { currentTab = 0 },
                              icon = { Icon(Icons.Default.CheckCircle, contentDescription = null) },
                              label = { Text("Attendance") }
                          )
                          NavigationBarItem(
                              selected = currentTab == 1,
                              onClick = { currentTab = 1 },
                              icon = { Icon(Icons.Default.People, contentDescription = null) },
                              label = { Text("Students (${students.size})") }
                          )
                          NavigationBarItem(
                              selected = currentTab == 2,
                              onClick = { currentTab = 2 },
                              icon = { Icon(Icons.Default.Dashboard, contentDescription = null) },
                              label = { Text("Dashboard") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(modifier = Modifier.padding(innerPadding).fillMaxSize()) {
                      when (currentTab) {
                          0 -> {
                              if (students.isEmpty()) {
                                  Column(
                                      modifier = Modifier.fillMaxSize().padding(24.dp),
                                      verticalArrangement = Arrangement.Center,
                                      horizontalAlignment = Alignment.CenterHorizontally
                                  ) {
                                      Text("Abhi koi student add nahi hai!", style = MaterialTheme.typography.titleMedium)
                                      Spacer(modifier = Modifier.height(12.dp))
                                      Button(onClick = { showAddStudentDialog = true }) {
                                          Icon(Icons.Default.Add, contentDescription = null)
                                          Spacer(modifier = Modifier.width(8.dp))
                                          Text("Add First Student")
                                      }
                                  }
                              } else {
                                  val initialMap = remember(dateRecords) {
                                      dateRecords.associate { it.studentId to it.isPresent }
                                  }
                                  DailyAttendanceScreen(
                                      students = students,
                                      selectedDate = selectedDate,
                                      onDateChange = { selectedDate = it },
                                      initialStatus = initialMap,
                                      onSaveAttendance = { map ->
                                          scope.launch {
                                              val records = map.map { (studentId, isPresent) ->
                                                  AttendanceRecord(
                                                      studentId = studentId,
                                                      date = selectedDate,
                                                      isPresent = isPresent
                                                  )
                                              }
                                              repository.saveAttendance(records)
                                              dashboardViewModel.loadDashboardStats()
                                              Toast.makeText(context, "Attendance Saved!", Toast.LENGTH_SHORT).show()
                                          }
                                      }
                                  )
                              }
                          }
                          1 -> {
                              Scaffold(
                                  topBar = { TopAppBar(title = { Text("Manage Students") }) },
                                  floatingActionButton = {
                                      ExtendedFloatingActionButton(
                                          onClick = { showAddStudentDialog = true },
                                          icon = { Icon(Icons.Default.PersonAdd, contentDescription = null) },
                                          text = { Text("Add Student") }
                                      )
                                  }
                              ) { pad ->
                                  LazyColumn(
                                      modifier = Modifier.padding(pad).fillMaxSize().padding(16.dp),
                                      verticalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      items(students, key = { it.id }) { student ->
                                          Card(modifier = Modifier.fillMaxWidth()) {
                                              Row(
                                                  modifier = Modifier.fillMaxWidth().padding(16.dp),
                                                  horizontalArrangement = Arrangement.SpaceBetween,
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  Column {
                                                      Text(student.name, style = MaterialTheme.typography.titleMedium)
                                                      Text("Roll: ${student.rollNumber} | Class: ${student.className}")
                                                  }
                                                  IconButton(onClick = {
                                                      scope.launch { repository.deleteStudent(student) }
                                                  }) {
                                                      Icon(Icons.Default.Delete, contentDescription = "Delete", tint = MaterialTheme.colorScheme.error)
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          2 -> {
                              Column(
                                  modifier = Modifier.fillMaxSize().padding(16.dp),
                                  verticalArrangement = Arrangement.spacedBy(12.dp)
                              ) {
                                  Text("Dashboard Overview", style = MaterialTheme.typography.headlineSmall)
                                  Card(modifier = Modifier.fillMaxWidth()) {
                                      Column(modifier = Modifier.padding(16.dp)) {
                                          Text("Total Students: ${dashState.totalStudents}", style = MaterialTheme.typography.titleMedium)
                                          Text("Total Recorded Days: ${dashState.totalRecordedDays}")
                                          Spacer(modifier = Modifier.height(8.dp))
                                          Text("Today Present: ${dashState.todayPresentCount}")
                                          Text("Today Absent: ${dashState.todayAbsentCount}")
                                          Text("Today Attendance: ${"%.1f".format(dashState.todayPercentage)}%")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (showAddStudentDialog) {
                  var name by remember { mutableStateOf("") }
                  var roll by remember { mutableStateOf("") }
                  var className by remember { mutableStateOf("") }

                  AlertDialog(
                      onDismissRequest = { showAddStudentDialog = false },
                      title = { Text("Add New Student") },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(value = name, onValueChange = { name = it }, label = { Text("Student Name") })
                              OutlinedTextField(value = roll, onValueChange = { roll = it }, label = { Text("Roll Number") })
                              OutlinedTextField(value = className, onValueChange = { className = it }, label = { Text("Class / Section") })
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              if (name.isNotBlank() && roll.isNotBlank() && className.isNotBlank()) {
                                  scope.launch {
                                      try {
                                          repository.insertStudent(name, roll, className)
                                          showAddStudentDialog = false
                                      } catch (e: Exception) {
                                          Toast.makeText(context, "Roll number already exists in this class!", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              }
                          }) {
                              Text("Save")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showAddStudentDialog = false }) { Text("Cancel") }
                      }
                  )
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-APK
          path: SmartAttendance-Android-Project/app/build/outputs/apk/debug/app-debug.apk
