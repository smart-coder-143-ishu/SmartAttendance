name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Aapki saari files is folder ke andar hain, isliye yeh zaroori hai
    defaults:
      run:
        working-directory: SmartAttendance-Android-Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Agar minSdk 24 hoga toh LocalDate crash karega, isliye ise 26 kar rahe hain
      - name: Fix minSdk version
        run: sed -i 's/minSdk = 24/minSdk = 26/g' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-APK
          path: SmartAttendance-Android-Project/app/build/outputs/apk/debug/app-debug.apk
